<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- The share picture (site/assets/brand/og.jpg), 1200x630. Open in a browser at that size and screenshot. -->
<style>
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(../site/assets/fonts/chakra-bold.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400 800;src:url(../site/assets/fonts/manrope.woff2) format("woff2")}
html,body{margin:0}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#F5F5F7;font-family:Manrope,sans-serif;background:#000}
.photo{position:absolute;right:-120px;top:-20px;width:900px;height:670px;object-fit:cover;object-position:50% 20%;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 34%);mask-image:linear-gradient(to right,transparent 0,#000 34%)}
.copy{position:absolute;left:80px;top:110px;display:grid;gap:22px;justify-items:start}
.tile{width:88px;height:88px;border-radius:22px;background:#000;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tile img{width:50px}
h1{margin:8px 0 0;font-family:"Chakra Petch";font-weight:700;font-size:104px;line-height:.98}
p{margin:0;font-size:30px;line-height:1.35;color:#A1A1A6}
.cta{margin-top:10px;display:inline-flex;align-items:center;height:56px;padding:0 28px;border-radius:999px;background:#0071E3;color:#fff;font-family:"Chakra Petch";font-weight:700;font-size:24px}
</style></head><body>
<div class="og">
  <img class="photo" src="../site/assets/photos/hero-iphone-orange.webp" alt="">
  <div class="copy">
    <div class="tile"><img src="../site/assets/brand/mark-white.png" alt=""></div>
    <h1>iDrop</h1>
    <p>Premium Apple Resellers<br>Sulthan Bathery, Wayanad</p>
    <span class="cta">idropdigital.com</span>
  </div>
</div>
</body></html>
