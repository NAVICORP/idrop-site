<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Chakra Petch";font-weight:700;src:url(../site/assets/fonts/chakra-bold.woff2) format("woff2")}
@font-face{font-family:"Manrope";font-weight:400 800;src:url(../site/assets/fonts/manrope.woff2) format("woff2")}
html,body{margin:0}
.og{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;font-family:Manrope,sans-serif;
  background:radial-gradient(120% 90% at 85% 10%,#3B2D1E 0%,#16110D 52%,#0A0807 100%)}
.og::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 360px at 78% 46%,rgba(216,195,160,.32),transparent 65%)}
.copy{position:absolute;left:80px;top:96px;display:grid;gap:22px}
.tile{width:92px;height:92px;border-radius:26px;background:#0C0A09;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tile img{width:54px}
h1{margin:10px 0 0;font-family:"Chakra Petch";font-weight:700;font-size:96px;line-height:.98}
p{margin:0;font-size:30px;color:rgba(243,233,215,.85)}
.obj{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.a{left:740px;top:96px;width:200px;rotate:-8deg}
.b{left:900px;top:70px;width:200px;rotate:8deg}
.c{left:600px;top:360px;width:200px}
</style></head><body>
<div class="og">
  <img class="obj a" src="../site/assets/3d/iphone-burgundy.webp">
  <img class="obj b" src="../site/assets/3d/duo-closed.webp">
  <img class="obj c" src="../site/assets/3d/earbuds.webp">
  <div class="copy">
    <div class="tile"><img src="../site/assets/brand/mark-white.png"></div>
    <h1>iDrop</h1>
    <p>Premium Apple Resellers<br>Sulthan Bathery, Wayanad</p>
  </div>
</div>
</body></html>
