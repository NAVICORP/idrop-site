# idropdigital.com: the static site, served by nginx on port 8000.
# No `types { }` block here: it would replace nginx's whole MIME list.
server {
  listen 8000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # www goes to the bare domain
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  location = /health {
    default_type application/json;
    return 200 '{"ok":true}';
  }

  # Styles and scripts: the browser checks for a new copy on every visit
  # (index.html also asks for them with a version that changes with their content).
  location ~* ^/assets/.+\.(css|js)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location ~* \.(pdf|ico|png|webmanifest)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }


  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /index.html;
}
